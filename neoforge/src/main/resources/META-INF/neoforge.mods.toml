modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/skiesworld/mc-qq/issues"

[[mods]]
modId = "mcqq"
version = "${version}"
displayName = "MC ↔ QQ Bot"
authors = "SkiesWorld"
description = '''Forwards chat, joins, quits and deaths to QQ groups and QQ group chat into Minecraft, over the QQ official bot API v2.'''

# The game itself: 26.x is the unobfuscated line this was written against. The range is what makes one jar
# cover several minor versions instead of one per version.
[[dependencies.mcqq]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcqq]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
