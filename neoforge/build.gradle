// This module is Groovy on purpose. ModDevGradle's documentation only publishes Groovy examples, so copying
// upstream verbatim means the next NeoForge bump is a diff against upstream rather than a translation of it.
// Every other project here is Kotlin DSL; Gradle lets each project choose.
plugins {
    id 'java'
    id 'net.neoforged.moddev'
    id 'com.gradleup.shadow'
}

base {
    archivesName = "${archives_base_name}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // ModDevGradle resolves the NeoForge artifacts itself, but naming the repository keeps it obvious.
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

neoForge {
    version = neoforge_version

    runs {
        server {
            server()
        }
    }

    // Which source set is the mod. Without this the dev runs would start a server with no mod in it.
    // The name here has to be the modId, and NeoForge modIds may not contain a hyphen — hence mc_qq.
    // To test the *packaged* jar instead (run/mods/…), comment this block out — otherwise the same modId is
    // discovered twice, once from here and once from the jar.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Same contract as the other platforms: the mod jar is the only classpath a server is guaranteed to have.
def bundled = configurations.create('bundled') {
    canBeResolved = true
}
configurations.named('implementation') { extendsFrom bundled }

dependencies {
    // `add` rather than `bundled ...`: a local variable of that name would shadow the dependency handler's
    // dynamic method, and Groovy would then try to call the Configuration itself.
    add('bundled', project(':core'))
    add('bundled', "io.github.skiesworld:qqbot-java-sdk:${qqbot_sdk_version}")
    add('bundled', "org.yaml:snakeyaml:${snakeyaml_version}")
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [bundled]
    archiveClassifier = ''

    ['io.github.skiesworld.qqbot', 'okhttp3', 'okio', 'com.google.gson', 'org.yaml.snakeyaml', 'kotlin'].each { pkg ->
        relocate(pkg, "${maven_group}.shaded.${pkg}")
    }

    // slf4j-api is provided by the game and must stay unrelocated, so it also must not be embedded.
    exclude 'org/slf4j/**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') { archiveClassifier = 'dev' }

tasks.named('processResources') {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: version,
                neoforge_version: neoforge_version,
                neoforge_loader_version_range: neoforge_loader_version_range,
                minecraft_version_range: minecraft_version_range)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
