# neoforge-26.1 窗口的构建事实。机制说明见 fabric/fabric-26.1/gradle.properties。

# 四段版本号：26.1.2.109 = 给 Minecraft 26.1.2 的 build 109。
neoforge_version=26.1.2.109
# 描述符要求加载器（FML）满足什么。NeoForge 26.1.2 带的是 3.x，它自己的描述符写 "[3,)"。
neoforge_loader_version_range=[3,)

# 发布时声称覆盖的游戏版本。minecraft_version_range（26.x 的窗口范围）不在这里 ——
# forge-26.1 也要用同一个值，所以它留在根文件里共享。
publish_game_versions=[26.1, 26.2]
