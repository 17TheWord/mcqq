// Groovy, like the NeoForge module: ForgeGradle's own docs are Groovy, so this stays a copy of the official
// MDK shape rather than a translation of it. The MDK used here is the 26.1.2-64.1.3 one.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
    id 'com.gradleup.shadow'
}

base {
    archivesName = "${archives_base_name}-forge"
}

// Mojang ships Java 25 in 26.1+, so a mod targets 25. core stays at 21 bytecode; only the adapters are 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

// Same contract as every other platform: the mod jar is the only classpath a server is guaranteed to have.
def bundled = configurations.create('bundled') {
    canBeResolved = true
}
configurations.named('implementation') { extendsFrom bundled }

dependencies {
    // `add` rather than `bundled ...`: a local variable of that name would shadow the dependency handler's
    // dynamic method, and Groovy would then try to call the Configuration itself.
    add('bundled', project(':core'))
    add('bundled', "io.github.skiesworld:qqbot-java-sdk:${qqbot_sdk_version}")
    add('bundled', "org.yaml:snakeyaml:${snakeyaml_version}")

    // Forge itself is provided by the server, so it is a normal dependency, not a bundled one.
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    configurations = [bundled]
    archiveClassifier = ''

    ['io.github.skiesworld.qqbot', 'okhttp3', 'okio', 'com.google.gson', 'org.yaml.snakeyaml', 'kotlin'].each { pkg ->
        relocate(pkg, "${maven_group}.shaded.${pkg}")
    }

    // slf4j-api is provided by the game and must stay unrelocated, so it also must not be embedded.
    exclude 'org/slf4j/**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') { archiveClassifier = 'dev' }

tasks.named('processResources') {
    inputs.property 'version', version
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(
                version: version,
                mod_id: mod_id,
                forge_version: forge_version,
                forge_loader_version_range: forge_loader_version_range,
                minecraft_version_range: minecraft_version_range)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
