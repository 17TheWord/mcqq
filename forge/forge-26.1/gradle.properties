# forge-26.1 窗口的构建事实。机制说明见 fabric/fabric-26.1/gradle.properties。

# 26.1.2-64.1.3 = Minecraft 26.1.2, Forge build 64.1.3。
# Forge 与 NeoForge 自 1.20.2 起分家，所以两者各有一套版本号与各自的窗口。
forge_version=26.1.2-64.1.3
# Forge 的 mods.toml 要的是**它自己的** build 号，不是游戏的。
forge_loader_version_range=[64,)

# 发布时声称覆盖的游戏版本。minecraft_version_range 留在根文件（与 neoforge-26.1 共用）。
publish_game_versions=[26.1, 26.2]
