modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/skiesworld/mc-qq/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "MC ↔ QQ Bot"
authors = "SkiesWorld"
description = '''Forwards chat, joins, quits and deaths to QQ groups and QQ group chat into Minecraft, over the QQ official bot API v2.'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_loader_version_range}"
    ordering = "NONE"
    side = "BOTH"

# The same window the other three descriptors advertise. Forge spells ranges like Maven does.
[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
