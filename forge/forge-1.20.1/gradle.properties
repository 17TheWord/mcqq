# forge-1.20.1 窗口 —— 另一代。机制说明见 fabric/fabric-26.1/gradle.properties。
#
# 这一代官方给的是 ForgeGradle 6 + Gradle 8，但 ModDevGradle 的
# `net.neoforged.moddev.legacyforge` 支持 Forge 1.17–1.20.1，而它与 neoforge 用的
# `net.neoforged.moddev` 是同一个 artifact 同一个版本 —— 所以这个窗口能待在同一个构建里，
# 不需要一套独立的 legacy 构建。依据见 docs/MULTIPLATFORM.md 第六节。

# 1.20.1-47.4.23 = Minecraft 1.20.1, Forge build 47.4.23。
forge_1201_version=1.20.1-47.4.23
# 1.20.1 的 FML 是 47.x；mods.toml 只要主版本号。
forge_1201_loader_version_range=[47,)
# 1.20.1 自己的窗口：它跑不了 1.20.2 及以后的任何东西。
# （根文件里的 minecraft_version_range 是 26.x 那份，这个窗口不用它，用自己的。）
forge_1201_minecraft_version_range=[1.20.1, 1.21)

publish_game_versions=[1.20.1, 1.20.2]
