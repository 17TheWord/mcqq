name: Platform matrix
description: 扫目录树算平台矩阵（平台/窗口 = 一个含构建脚本的目录；事实在各自的 gradle.properties）

# 这是"有哪些平台、每个 jar 叫什么、发布时算什么 loader、覆盖哪些游戏版本"的唯一出处。
#
# 逻辑在 `.github/scripts/platform-matrix.sh` —— 放在独立脚本里，CI 与本地跑的是同一份。
# 加一个窗口 = 建一个 `平台/窗口/` 目录（含构建脚本 + gradle.properties 里的 publish_game_versions），
# **不用改这个 action，也不用改 release.yml 的产物路径** —— 那些现在都是推导出来的。
#
# 为什么是 action 而不是工作流：这段逻辑本身没有 job 语义（不 checkout、不 build），
# 只是一个"算出一份 JSON"的步骤 —— 放在 action 里，任何 job 都能中途 `uses:` 它。
# 需要它喂给 `strategy.matrix` 时，外面再套一层可复用工作流
# （`.github/workflows/platforms.yml`），原因见那个文件。
#
# ⚠️ 本 action 假定仓库**已经 checkout** 到当前工作目录（脚本要扫目录树）。

# 寻址格式：矩阵每一行的名字是**窗口目录名**（`fabric-26.1`、`forge-1.20.1`），
# 下面的筛选就是按它拆的 —— 这两个输入都按这个格式填。
inputs:
  platforms:
    description: >-
      要构建哪些平台，逗号分隔。每一项可以是平台名（fabric / neoforge / forge / paper / spigot），
      也可以是完整窗口名（forge-1.20.1）。留空或 `all` = 全部。
    required: false
    default: ""
  versions:
    description: >-
      要构建哪些 MC 窗口，逗号分隔（26.1 / 1.20.1）。留空或 `all` = 全部。
      与 platforms 是"与"的关系，所以 forge + 1.20.1 只会得到 forge-1.20.1。
    required: false
    default: ""

outputs:
  version:
    description: 根 gradle.properties 里的 mod_version
    value: ${{ steps.matrix.outputs.version }}
  matrix:
    description: 平台矩阵，直接喂给 strategy.matrix
    value: ${{ steps.matrix.outputs.matrix }}
  jars:
    description: 每个窗口的产物路径，一行一个（release.yml 上传用）
    value: ${{ steps.matrix.outputs.jars }}

runs:
  using: composite
  steps:
    - name: Derive the platform matrix from the directory tree
      id: matrix
      shell: bash
      # 筛选条件走环境变量传进去；脚本自己读根 gradle.properties 拿 mod_version 与 archives_base_name。
      env:
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_VERSIONS: ${{ inputs.versions }}
      run: bash .github/scripts/platform-matrix.sh
