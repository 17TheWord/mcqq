name: Release

# 打一个 v* 标签就发一次。
#
# 平台清单与 MC 窗口来自 .github/workflows/platforms.yml（**唯一一份**），所以加平台只改那一个文件。
#
# 形状照 17TheWord/QueQiao 的 .github/workflows/build.yml：先算出矩阵，再让**每个产物各跑一次
# mc-publish**（并行，各自声明 loaders 与 game-versions）。
#
# 与那边唯一的差别：**构建不拆进矩阵**。QueQiao 每格是独立工程，所以每格自己 build；本项目一次
# `./gradlew build` 就出全部产物，拆成四格只会把 MC 工具链下载四遍。
#
# 现阶段没有 Modrinth / CurseForge 的项目 id：**publish 整个 job 会被跳过**，
# 构建、产物留存（Actions artifacts）与 GitHub Release 照常进行。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 配了才有发布这一步。仓库 Settings → Secrets and variables → Actions：
  #   Variables: MODRINTH_ID / CURSEFORGE_ID（先在平台上建好项目）
  #   Secrets:   MODRINTH_TOKEN / CURSEFORGE_TOKEN
  MODRINTH_ID: ${{ vars.MODRINTH_ID }}
  CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}

jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml

  build:
    needs: platforms
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java & Gradle
        uses: ./.github/actions/set-java
        with:
          java-version: '25'

      # 版本号只有一个出处（gradle.properties 的 mod_version，由 platforms.yml 读出来），
      # 标签必须和它一致，否则产物的文件名、Modrinth 上的版本号会与标签对不上。
      - name: Check the tag matches the version in gradle.properties
        shell: bash
        run: |
          if [ "v${{ needs.platforms.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 gradle.properties 里的 v${{ needs.platforms.outputs.version }} 不一致；先改 mod_version 再打标签。"
            exit 1
          fi

      # 标签里带连字符就当作预发布（v0.2.0-beta.1）。这个值要给 publish job 用，所以写成 job output
      # —— 跨 job 的 env 是不通的。
      - name: Decide whether this is a prerelease
        id: tag
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) echo "prerelease=true"  >> $GITHUB_OUTPUT ;;
            *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build every platform and run the tests
        run: ./gradlew clean build -PwithForge=true --stacktrace

      - name: Keep the jars
        uses: actions/upload-artifact@v4
        with:
          name: mc-qq-${{ needs.platforms.outputs.version }}
          path: |
            fabric/build/libs/mc-qq-*.jar
            neoforge/build/libs/mc-qq-*.jar
            forge/build/libs/mc-qq-*.jar
            bukkit/build/libs/mc-qq-*.jar
          if-no-files-found: error

      - name: Create the release and attach the jars
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          JARS=$(printf '%s ' \
            "fabric/build/libs/mc-qq-${{ needs.platforms.outputs.version }}.jar" \
            "neoforge/build/libs/mc-qq-neoforge-${{ needs.platforms.outputs.version }}.jar" \
            "forge/build/libs/mc-qq-forge-${{ needs.platforms.outputs.version }}.jar" \
            "bukkit/build/libs/mc-qq-bukkit-${{ needs.platforms.outputs.version }}.jar")
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --prerelease $JARS
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes $JARS
          fi

  publish:
    needs: [ platforms, build ]
    # 没有项目 id 就整段跳过：这一步是"上架"，不是"发版"。
    if: vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.platforms.outputs.matrix) }}
    name: ${{ matrix.name }}

    steps:
      # 这个 job 不 checkout、不装 Gradle：只用上一个 job 传过来的产物与矩阵里的元数据。
      - name: Fetch the jars built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: mc-qq-${{ needs.platforms.outputs.version }}
          path: jars

      - name: Publish ${{ matrix.name }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: mc-qq ${{ needs.platforms.outputs.version }} (${{ matrix.name }})
          # 同一版本号的多个产物必须能区分开，所以加 loader 后缀。
          version: ${{ needs.platforms.outputs.version }}+${{ matrix.name }}
          version-type: ${{ needs.build.outputs.prerelease == 'true' && 'beta' || 'release' }}
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ needs.platforms.outputs.game_versions }}
          files: jars/${{ matrix.jar }}
