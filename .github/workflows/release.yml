name: Release

# **合并进 main 就发一次**（版本号变了的话）。
#
# 版本号只有一个出处：`gradle.properties` 的 `mod_version`。合进 main 时读它，
# 标签由 `gh release create` 顺手打在当前 HEAD 上。
#
# ⚠️ 触发条件必须是 **push: main**，不能是 tag。
# 用内置 `GITHUB_TOKEN` 推的 tag **不会触发其他工作流**（GitHub 防递归的规则），
# 所以"一个工作流打 tag、另一个挂 tag 触发"那种写法，后者永远不会跑。
# 鹊桥（17TheWord/QueQiao）也是因此让 build 与 release 都挂 push: main。
#
# **手动入口可以选分支**：在 Actions → Release → Run workflow 里选任何分支即可。
# 非 main 分支上，实际发布版本会**自动加上 -beta.<短 sha>**（见 gate），
# 所以 gradle.properties 里永远只写正式号（0.0.1 / 0.0.2），不用手写 -beta.N。
# 带后缀 = 预发布（`--prerelease`，Modrinth 上 version-type 也是 beta）；
# 非 main 分支**不上架商店**，只留 GitHub Release。
#
# ⚠️ 版本号没变就不发：**检测到 v<版本> 标签已存在就停**，不删了重建。
# 这样"发版"是一个**明确的动作**（在 dev 上改 mod_version，再合 PR），
# 而不是"每次合并的副作用"；也不会出现"同一个版本被反复发布"。
# （先删再建是鹊桥的做法，对"每次合并都重发"是够用的，但版本号才是发布的依据，
#  让它来当闸门更直白。要重发就先把那个标签删掉，再手动跑一次。）
#
# 平台清单与 MC 窗口来自 .github/workflows/platforms.yml（**唯一一份**），所以加平台只改那一个文件。
#
# 平台清单与 MC 窗口来自 .github/workflows/platforms.yml（**唯一一份**），所以加平台只改那一个文件。
#
# 形状照 17TheWord/QueQiao 的 .github/workflows/build.yml：先算出矩阵，再让**每个产物各跑一次
# mc-publish**（并行，各自声明 loaders 与 game-versions）。
#
# 与那边唯一的差别：**构建不拆进矩阵**。QueQiao 每格是独立工程，所以每格自己 build；本项目一次
# `./gradlew build` 就出全部产物，拆成四格只会把 MC 工具链下载四遍。
#
# 现阶段没有 Modrinth / CurseForge 的项目 id：**publish 整个 job 会被跳过**，
# 构建、产物留存（Actions artifacts）与 GitHub Release 照常进行。
on:
  push:
    branches:
      - main
  # 手动跑一次：用来重试（比如上一次发布中途失败了）。标签还在就照样跳过。
  workflow_dispatch:

permissions:
  contents: write

env:
  # 配了才有发布这一步。仓库 Settings → Secrets and variables → Actions：
  #   Variables: MODRINTH_ID / CURSEFORGE_ID（先在平台上建好项目）
  #   Secrets:   MODRINTH_TOKEN / CURSEFORGE_TOKEN
  MODRINTH_ID: ${{ vars.MODRINTH_ID }}
  CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}

jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml

  # 该不该发。**版本号变了才发** —— v<版本> 标签已存在就整段跳过。
  # 查标签而不是查 release：标签才是"这个版本发过没有"的唯一依据，
  # 也顺带挡住"只打了标签没建 release"那种半成品状态。
  gate:
    needs: platforms
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Is there anything to release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # 实际发布版本：**非 main 分支自动加 -beta.<短 sha> 后缀**。
          # 所以 gradle.properties 里永远只写正式号（0.0.1 / 0.0.2），不用手写 -beta.N。
          # 用短 sha 而不是 -beta.N：同一个提交得到的版本是固定的，重跑不会变；
          # 不同提交也不会撞（`-beta` 固定后缀的话，同一个分支第二次就发不出去了 —— 标签已存在）。
          EFFECTIVE="$VERSION"
          if [ "${{ github.ref_name }}" != "main" ]; then
            case "$VERSION" in
              *-*)
                echo "版本号已经带后缀了（$VERSION），不再追加。"
                ;;
              *)
                SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
                EFFECTIVE="$VERSION-beta.$SHORT"
                echo "非 main 分支（${{ github.ref_name }}）→ 实际发布版本 $EFFECTIVE"
                ;;
            esac
          fi
          echo "version=$EFFECTIVE" >> $GITHUB_OUTPUT

          if gh api "repos/${{ github.repository }}/git/ref/tags/v$EFFECTIVE" >/dev/null 2>&1; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "::notice::v$EFFECTIVE 的标签已经存在，跳过发布。要重发就先删掉那个标签。"
          else
            echo "release=true" >> $GITHUB_OUTPUT
            echo "v$EFFECTIVE 还没有标签，继续发布。"
          fi

  build:
    needs: [ platforms, gate ]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-26.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java & Gradle
        uses: ./.github/actions/set-java
        with:
          java-version: '25'

      # 版本号只有一个出处（gradle.properties 的 mod_version，由 platforms.yml 读出来）。
      # 带连字符就当作预发布（0.2.0-beta.1）。这个值要给 publish job 用，所以写成 job output
      # —— 跨 job 的 env 是不通的。
      - name: Decide whether this is a prerelease
        id: tag
        shell: bash
        run: |
          case "${{ needs.gate.outputs.version }}" in
            *-*) echo "prerelease=true"  >> $GITHUB_OUTPUT ;;
            *)   echo "prerelease=false" >> $GITHUB_OUTPUT ;;
          esac

      # 用算出来的实际版本构建：-Pmod_version 会覆盖 gradle.properties 里的值，
      # 一路进产物名与描述符（fabric.mod.json / mods.toml / plugin.yml 里都是它）。
      - name: Build every platform and run the tests
        run: ./gradlew clean build -PwithForge=true -Pmod_version=${{ needs.gate.outputs.version }} --stacktrace

      - name: Keep the jars
        uses: actions/upload-artifact@v7
        with:
          name: mc-qq-${{ needs.gate.outputs.version }}
          path: |
            fabric/fabric-26.1/build/libs/mc-qq-*.jar
            neoforge/neoforge-26.1/build/libs/mc-qq-*.jar
            forge/forge-26.1/build/libs/mc-qq-*.jar
            forge/forge-1.20.1/build/libs/mc-qq-*.jar
            spigot/spigot-1.20.1/build/libs/mc-qq-*.jar
            paper/paper-1.20.1/build/libs/mc-qq-*.jar
          if-no-files-found: error

      - name: Create the release and attach the jars
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          JARS=$(printf '%s ' \
            "fabric/fabric-26.1/build/libs/mc-qq-fabric-26.1-${{ needs.gate.outputs.version }}.jar" \
            "neoforge/neoforge-26.1/build/libs/mc-qq-neoforge-26.1-${{ needs.gate.outputs.version }}.jar" \
            "forge/forge-26.1/build/libs/mc-qq-forge-26.1-${{ needs.gate.outputs.version }}.jar" \
            "forge/forge-1.20.1/build/libs/mc-qq-forge-1.20.1-${{ needs.gate.outputs.version }}.jar" \
            "spigot/spigot-1.20.1/build/libs/mc-qq-spigot-1.20.1-${{ needs.gate.outputs.version }}.jar" \
            "paper/paper-1.20.1/build/libs/mc-qq-paper-1.20.1-${{ needs.gate.outputs.version }}.jar")
          # 标签由 gh 顺手打在当前 HEAD（也就是刚合进 main 的那个提交）上。
          TAG="v${{ needs.gate.outputs.version }}"
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" --generate-notes --prerelease $JARS
          else
            gh release create "$TAG" --generate-notes $JARS
          fi

  publish:
    needs: [ platforms, gate, build ]
    # 没有项目 id 就整段跳过：这一步是"上架"，不是"发版"。
    # 非 main 分支也跳过 —— feature 分支上发的测试版只留 GitHub Release，不上架商店。
    if: needs.gate.outputs.release == 'true' && github.ref_name == 'main'
        && (vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '')
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.platforms.outputs.matrix) }}
    name: ${{ matrix.name }}

    steps:
      # 这个 job 不 checkout、不装 Gradle：只用上一个 job 传过来的产物与矩阵里的元数据。
      - name: Fetch the jars built by the previous job
        uses: actions/download-artifact@v8
        with:
          name: mc-qq-${{ needs.gate.outputs.version }}
          path: jars

      - name: Publish ${{ matrix.name }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: mc-qq ${{ needs.gate.outputs.version }} (${{ matrix.name }})
          # 同一版本号的多个产物必须能区分开，所以加 loader 后缀。
          version: ${{ needs.gate.outputs.version }}+${{ matrix.name }}
          version-type: ${{ needs.build.outputs.prerelease == 'true' && 'beta' || 'release' }}
          loaders: ${{ matrix.loaders }}
          # 每个窗口各自声明（`publish_game_versions_*`）：26.x 的 jar 装不到 1.20.1 上，共用一份列表会误导人。
          game-versions: ${{ matrix.game-versions }}
          files: jars/${{ matrix.jar }}
