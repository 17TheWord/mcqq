name: Release

# **推一个 tag 就发一次。tag 本身就是发布版本。**
#
#   git tag v0.0.2        && git push origin v0.0.2         → 正式版
#   git tag v0.0.2-beta   && git push origin v0.0.2-beta    → 预发布（--prerelease，Modrinth 的
#                                                             version-type 也是 beta，照常上架）
#
# 版本号以 **tag** 为准：`v` 后面那串就是版本（`0.0.2` / `0.0.2-beta`），它会经 `-Pmod_version`
# 一路进产物名与描述符（fabric.mod.json / mods.toml / plugin.yml）。
# 根 `gradle.properties` 的 `mod_version` 只是**本地开发默认值**，发布时被 tag 覆盖。
#
# ⚠️ **tag 必须由人推（或非 GITHUB_TOKEN 的凭证推）。**
# 用内置 `GITHUB_TOKEN` 推的 tag **不会触发其他工作流**（GitHub 防递归的规则），
# 所以"一个工作流打 tag、另一个挂 tag 触发"那种写法，后者永远不会跑。
# 这也正是本工作流**不再挂 `push: main`** 的原因：发版是一个**明确的动作** —— 推一个 tag，
# 而不是"每次合并的副作用"（合并进 main 只跑 test.yml 那套 PR 检查，不发版）。
#
# ⚠️ **幂等：同一个 tag 已经有 Release 就整段跳过**，不会重复构建、重复上架。
# 要重发就先删掉那个 Release 与 tag，再重新推 tag；或从 Actions → Release → Run workflow
# 手动填那个 tag 再跑一次（用于"上次跑到一半失败、想接着跑"的情况）。
#
# ⚠️ GitHub Release **只放自动生成的变更日志，不带 jar** —— 下载入口是 Modrinth / CurseForge。
#
# 平台清单与 MC 窗口来自 .github/workflows/platforms.yml（**唯一一份**），所以加平台只改那一个文件。
#
# 形状照 17TheWord/QueQiao 的 .github/workflows/build.yml：先算出矩阵，再让**每个产物各跑一次
# mc-publish**（并行，各自声明 loaders 与 game-versions）。
#
# 与那边唯一的差别：**构建不拆进矩阵**。QueQiao 每格是独立工程，所以每格自己 build；本项目一次
# `./gradlew build` 就出全部产物，拆成四格只会把 MC 工具链下载四遍。
#
# 现阶段没有 Modrinth / CurseForge 的项目 id：**publish 整个 job 会被跳过**，
# 构建、产物留存（Actions artifacts）与 GitHub Release 照常进行。
on:
  push:
    tags:
      - 'v*'
  # 手动入口：给"重跑 / 补发"用。push 事件本来就带 tag，这条只是另一条路。
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（例如 v0.0.2）。必须已经存在。
        required: true
        type: string
      # ⚠️ 不是下拉：GitHub 的 `choice` **只能单选**，而"补发两个平台"是常见需求。
      # 逗号分隔即可（`paper,spigot`）—— 拼错的 token 脚本只会 ::warning:: 并忽略，不会阻断。
      platforms:
        description: 平台，逗号分隔（fabric / neoforge / forge / paper / spigot）；留空或 all = 全部
        required: false
        type: string
      versions:
        description: 只发哪些 MC 窗口，逗号分隔（如 1.20.1，或 26.1,1.20.1）；留空或 all = 全部
        required: false
        type: string
      republish:
        description: 重发模式 —— 这个 tag 已经有 Release 也继续（补发个别窗口时勾上）
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 配了才有发布这一步。仓库 Settings → Secrets and variables → Actions：
  #   Variables: MODRINTH_ID / CURSEFORGE_ID（先在平台上建好项目）
  #   Secrets:   MODRINTH_TOKEN / CURSEFORGE_TOKEN
  MODRINTH_ID: ${{ vars.MODRINTH_ID }}
  CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}

jobs:
  # 平台矩阵（唯一出处）。version 输出在这里没用了 —— 发布版本现在来自 tag；它仍给 test.yml 用。
  platforms:
    uses: ./.github/workflows/platforms.yml
    with:
      # 手动入口可以只发一部分窗口（补发用）；push: tags 时这两个输入是空串 = 全部。
      platforms: ${{ inputs.platforms }}
      versions: ${{ inputs.versions }}

  # 该不该发。**同一个 tag 已经有 Release 就整段跳过** —— 查 Release 而不是查 tag：
  # 这次运行本来就是 tag 触发的，tag 必然存在，拿它当闸门等于没闸门。
  # 查 Release 也顺带挡住"跑了两次、第二次重复上架"。
  gate:
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Resolve the tag and check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # push: tags 时 github.ref_name 就是那个 tag。
          PUSHED_TAG: ${{ github.ref_name }}
          # 手动入口（workflow_dispatch）输入的 tag。push 事件下它是空串。
          INPUT_TAG: ${{ github.event.inputs.tag }}
          # 重发模式：勾上就跳过"已有 Release 就停"，用于补发个别窗口。
          REPUBLISH: ${{ github.event.inputs.republish }}
        run: |
          # 手动入口优先：那时 github.ref_name 是分支，真正要发的是输入的那个 tag。
          TAG="${INPUT_TAG:-$PUSHED_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::拿不到 tag（push 事件应带 tag；手动跑请在 inputs.tag 里填一个）"
            exit 1
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头（当前：$TAG）"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          # 预发布：tag 里带连字符（v0.0.2-beta）。正式号不带。
          case "$VERSION" in
            *-*) PRE=true ;;
            *)   PRE=false ;;
          esac
          echo "tag=$TAG"               >> $GITHUB_OUTPUT
          echo "version=$VERSION"       >> $GITHUB_OUTPUT
          echo "prerelease=$PRE"        >> $GITHUB_OUTPUT
          echo "tag=$TAG  version=$VERSION  prerelease=$PRE"

          if [ "$REPUBLISH" = "true" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "::notice::重发模式（republish=true）—— 跳过「已有 Release 就停」的检查"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "::notice::$TAG 已经有 Release 了，跳过。补发个别窗口就勾 republish；整版重发要先删掉那个 Release 与 tag。"
          else
            echo "release=true" >> $GITHUB_OUTPUT
            echo "$TAG 还没有 Release，继续发布。"
          fi

  build:
    needs: [ platforms, gate ]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-26.04
    steps:
      # 在 **tag 那个提交**上构建（手动重试时 github.ref 是分支，必须显式指定 tag）。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Setup Java & Gradle
        uses: ./.github/actions/set-java
        with:
          java-version: '25'

      # 用 tag 里的版本构建：-Pmod_version 覆盖 gradle.properties 的值，一路进产物名与描述符。
      - name: Build every platform and run the tests
        run: ./gradlew clean build -Pmod_version=${{ needs.gate.outputs.version }} --stacktrace

      # 产物只传给下面的 publish job（它用 download-artifact 取），不进 Release。
      # 路径来自平台矩阵（`.github/scripts/platform-matrix.sh` 按目录树推导），不再手写 ——
      # 加窗口或改 archives_base_name 都不用动这里。通配版本 + 排除薄 jar。
      # ⚠️ Actions artifacts 默认 90 天过期，所以长期归档只有 Modrinth / CurseForge 那两份。
      - name: Keep the jars for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: mc-qq-${{ needs.gate.outputs.version }}
          path: |
            ${{ needs.platforms.outputs.jars }}
            !**/*-dev.jar
          if-no-files-found: error

      # Release **只放自动生成的变更日志，不带任何 jar**。
      # 下载入口在 Modrinth / CurseForge（README 指向那边）：平台有社区、有分类与依赖信息，
      # 而且下载量算数。GitHub 这边再挂一份只会分流。
      # ⚠️ `--verify-tag`：tag 必须已经存在（就是它触发的这次运行）—— 不让 gh 顺手新建一个 tag，
      # 免得把 Release 挂到一个内容对不上的提交上。
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          # 重发时 Release 已经存在 —— 不重建（`--generate-notes` 会把原有的变更日志冲掉）。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建（重发模式）"
          elif [ "${{ needs.gate.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" --generate-notes --prerelease --verify-tag
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi

  publish:
    needs: [ platforms, gate, build ]
    # 没有项目 id 就整段跳过：这一步是"上架"，不是"发版"。
    # **beta 也照常上架** —— 测试版就是发到 Modrinth / CurseForge 上给人测的，
    # 版本号带后缀时 mc-publish 的 version-type 会自动是 beta。
    if: needs.gate.outputs.release == 'true'
        && (vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '')
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.platforms.outputs.matrix) }}
    name: ${{ matrix.name }}

    steps:
      # 这个 job 不 checkout、不装 Gradle：只用上一个 job 传过来的产物与矩阵里的元数据。
      - name: Fetch the jars built by the previous job
        uses: actions/download-artifact@v8
        with:
          name: mc-qq-${{ needs.gate.outputs.version }}
          path: jars

      - name: Publish ${{ matrix.name }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: mc-qq ${{ needs.gate.outputs.version }} (${{ matrix.name }})
          # 同一版本号的多个产物必须能区分开，所以加 loader 后缀。
          version: ${{ needs.gate.outputs.version }}+${{ matrix.name }}
          version-type: ${{ needs.gate.outputs.prerelease == 'true' && 'beta' || 'release' }}
          loaders: ${{ matrix.loaders }}
          # 每个窗口各自声明（各自 gradle.properties 里的 publish_game_versions，由矩阵脚本读出）：
          # 26.x 的 jar 装不到 1.20.1 上，共用一份列表会误导人。
          game-versions: ${{ matrix.game-versions }}
          files: jars/${{ matrix.jar }}
