name: Test

# 推 main 与每个 PR 都跑：**每个平台各一格**，并行，哪一格挂了就是哪个平台坏了。
# 平台清单来自 .github/workflows/platforms.yml —— 加平台只改那一个文件。
#
# 也可以手动跑（Actions → Test → Run workflow），用两个输入挑"要构建哪几个"：
#   platforms: forge             → forge 的全部窗口
#   platforms: forge-1.20.1      → 只要这一个窗口（平台名或完整窗口名都行）
#   versions:  26.1              → 只要 26.1 那一档
#   两个都留空                     → 全部，与 push 时一样
# 产物照常传成 artifact，所以"我想要一个 forge-1.20.1 的 jar"就是这么拿。
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:
    inputs:
      platforms:
        description: 要构建哪些平台，逗号分隔（平台名如 forge，或完整窗口名如 forge-1.20.1）；留空 = 全部
        required: false
        default: ""
      versions:
        description: 要构建哪些 MC 窗口，逗号分隔（26.1 / 1.20.1）；留空 = 全部
        required: false
        default: ""

jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml
    # push / PR 时 inputs 是空的，等于"全部"；手动跑时才带上筛选。
    with:
      platforms: ${{ inputs.platforms }}
      versions: ${{ inputs.versions }}

  build:
    needs: platforms
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      # 一格失败不影响其他格：四个平台的编译结果一次看全，不用改一个跑一遍。
      fail-fast: false
      matrix: ${{ fromJson(needs.platforms.outputs.matrix) }}
    # 让检查列表里显示成 "build (fabric)" 而不是一串参数。
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java & Gradle
        uses: ./.github/actions/set-java
        with:
          java-version: '25'

      # 每格都跑一遍 core 的测试：测试本身只有几十毫秒，换来的是"这一格的平台在 core 旁边也编译得过"。
      # matrix.properties 只有 forge 那格非空（-PwithForge=true），见 platforms.yml 的说明。
      - name: Build ${{ matrix.name }} and run the tests
        run: ./gradlew :core:test ${{ matrix.project }}:build ${{ matrix.properties }} --stacktrace

      - name: Keep the ${{ matrix.name }} jar
        uses: actions/upload-artifact@v7
        with:
          name: mc-qq-${{ needs.platforms.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.jar }}
          if-no-files-found: error
