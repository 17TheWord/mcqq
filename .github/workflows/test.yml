name: Test

# 推 main 与每个 PR 都跑：**每个平台各一格**，并行，哪一格挂了就是哪个平台坏了。
# 平台清单来自 .github/workflows/platforms.yml —— 加平台只改那一个文件。
#
# 也可以手动跑（Actions → Test → Run workflow），用两个下拉框挑"要构建哪几个"：
#   platforms: forge + versions: all      → forge 的全部窗口
#   platforms: forge + versions: 1.20.1   → 就那一个窗口
#   两个都 all                             → 全部，与 push 时一样
# 产物照常传成 artifact，所以"我想要一个 forge-1.20.1 的 jar"就是这么拿。
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:
    inputs:
      # 用 choice 而不是自由文本：平台和窗口都只有几个，下拉框直接挡住手打错。
      # ⚠️ `choice` 只有 workflow_dispatch 支持 —— workflow_call 的 type 只允许 boolean/number/string。
      # 所以下面那两层（platforms.yml → action）收到的仍是字符串，它们照样支持逗号分隔的列表，
      # 程序化调用可以传 `forge,paper` 或完整窗口名 `forge-1.20.1`；下拉框这边一次只能挑一个。
      platforms:
        description: 要构建哪个平台
        type: choice
        default: all
        options:
          - all
          - fabric
          - neoforge
          - forge
          - paper
          - spigot
      versions:
        description: 要构建哪个 MC 窗口
        type: choice
        default: all
        options:
          - all
          - "26.1"
          - "1.20.1"

jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml
    # push / PR 时 inputs 是空的，等于"全部"；手动跑时才带上筛选。
    with:
      platforms: ${{ inputs.platforms }}
      versions: ${{ inputs.versions }}

  build:
    needs: platforms
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      # 一格失败不影响其他格：四个平台的编译结果一次看全，不用改一个跑一遍。
      fail-fast: false
      matrix: ${{ fromJson(needs.platforms.outputs.matrix) }}
    # 让检查列表里显示成 "build (fabric)" 而不是一串参数。
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java & Gradle
        uses: ./.github/actions/set-java
        with:
          java-version: '25'

      # 每格都跑一遍 core 的测试：测试本身只有几十毫秒，换来的是"这一格的平台在 core 旁边也编译得过"。
      # matrix.properties 只有 forge 那格非空（-PwithForge=true），见 platforms.yml 的说明。
      - name: Build ${{ matrix.name }} and run the tests
        run: ./gradlew :core:test ${{ matrix.project }}:build ${{ matrix.properties }} --stacktrace

      - name: Keep the ${{ matrix.name }} jar
        uses: actions/upload-artifact@v7
        with:
          name: mc-qq-${{ needs.platforms.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.jar }}
          if-no-files-found: error
