name: Platforms

# 把平台矩阵算出来交给调用方（test 与 release 都 uses 它）。逻辑在
# `.github/actions/platform-matrix/`，CI 与本地跑的是同一份。
#
# 外面这层之所以存在：`strategy.matrix` 在 job 启动前就要定下来，只能用 `needs`/`outputs` 传，
# 所以得有个前置 job 算；而它要能复用，就只有 `workflow_call` 这条路。
#
# 加窗口 / 加平台 / 只构建一部分的说明见 docs/RELEASING.md。
on:
  workflow_call:
    # 两个筛选条件直接转发给 action。调用方不传就是"全部"，所以 release 那边一个字都不用写。
    # ⚠️ 这里只能是 string —— `choice` 只有 workflow_dispatch 支持。手动入口（test.yml）用了下拉框，
    # 到这一层已经是普通字符串了；本层支持逗号分隔的列表。
    inputs:
      platforms:
        description: 要构建哪些平台，逗号分隔（平台名如 forge，或完整窗口名如 forge-1.20.1）；留空或 all = 全部
        required: false
        type: string
        default: ""
      versions:
        description: 要构建哪些 MC 窗口，逗号分隔（26.1 / 1.20.1）；留空或 all = 全部。与 platforms 是"与"的关系
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: 根 gradle.properties 里的 mod_version
        value: ${{ jobs.platforms.outputs.version }}
      matrix:
        description: 平台矩阵，喂给 strategy.matrix（每行自带它那个窗口的 game-versions）
        value: ${{ jobs.platforms.outputs.matrix }}
      jars:
        description: 每个窗口的产物路径，一行一个（release.yml 上传用）
        value: ${{ jobs.platforms.outputs.jars }}

jobs:
  platforms:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.matrix.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      jars: ${{ steps.matrix.outputs.jars }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Work out the platform matrix
        id: matrix
        uses: ./.github/actions/platform-matrix
        with:
          platforms: ${{ inputs.platforms }}
          versions: ${{ inputs.versions }}
