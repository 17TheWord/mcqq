name: Platforms

# 这个工作流只有一件事：把平台矩阵算出来交给调用方。真正的逻辑在
# `.github/actions/platform-matrix/` —— 放在 action 里，任何 job 都能中途 `uses:` 它。
#
# **为什么外面还得套一层工作流**：`strategy.matrix` 在 job 启动前就要定下来，而它能用的上下文只有
# `github / needs / vars / inputs`（GitHub 的上下文可用性表），**用不了 `steps`**。所以矩阵必须由
# **前置 job** 算好、再经 `needs.<job>.outputs.matrix` 传下来；而"前置 job"本身要能复用，
# 就只有 `workflow_call` 这条路 —— 纯 action 方案会让 test 与 release 各写一份前置 job，
# 恰好丢掉要复用的那一半。
#
# test 与 release 都调它（`uses: ./.github/workflows/platforms.yml`）。于是：
#   * 加平台 → 改 `.github/actions/platform-matrix/action.yml` 里的矩阵（另外还要改
#     `settings.gradle.kts` 的 include，以及 `release.yml` 里两处产物路径 —— 那两处不在这里）
#   * 改版本号或 MC 窗口 → **不在这里改**：那些事实的唯一出处是 gradle.properties
#     （`mod_version`、`publish_game_versions_*`、`minecraft_version_range`），这里只读出来传给调用方。
#   * 只构建一部分 → 调它时传 `with: { platforms: forge, versions: 1.20.1 }`（两者是"与"的关系；
#     留空 = 全部）。test.yml 的 workflow_dispatch 就是给这个用的。
#
# 为什么 build 不在这里做：本项目一次 `./gradlew build` 就出全部产物，而 loom/moddev 的工具链是共享的，
# 拆成矩阵会把 MC 工具链各下一遍。矩阵真正需要的地方是**发布**（每个产物一次 mc-publish）与
# **每平台一份产物**。
#
# 跑在哪个 runner：三个工作流都钉 `ubuntu-26.04`，不用 `ubuntu-latest`。
# `-latest` 会在 GitHub 迁移时**悄悄换掉底层系统**（2026-10-19 起指向 Ubuntu 26），而 CI 的工具链对系统版本
# 敏感（glibc、Java、构建工具都跟着走）；钉死换来可复现。代价是 GitHub 弃用某个镜像时要手动跟进 ——
# 届时把 platforms / test / release 三处一起改（这个 label 没法像平台清单那样共用：`runs-on` 要在 job
# 启动前就定下来，而读一个共享值本身得先跑一个 job）。
on:
  workflow_call:
    # 两个筛选条件直接转发给 action。调用方不传就是"全部"，所以 release 那边一个字都不用写。
    inputs:
      platforms:
        description: 要构建哪些平台，逗号分隔（平台名如 forge，或完整窗口名如 forge-1.20.1）；留空 = 全部
        required: false
        type: string
        default: ""
      versions:
        description: 要构建哪些 MC 窗口，逗号分隔（26.1 / 1.20.1）；留空 = 全部。与 platforms 是"与"的关系
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: gradle.properties 里的 mod_version
        value: ${{ jobs.platforms.outputs.version }}
      matrix:
        description: 平台矩阵，喂给 strategy.matrix（每行自带它那个窗口的 game-versions）
        value: ${{ jobs.platforms.outputs.matrix }}

jobs:
  platforms:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.matrix.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Work out the platform matrix
        id: matrix
        uses: ./.github/actions/platform-matrix
        with:
          platforms: ${{ inputs.platforms }}
          versions: ${{ inputs.versions }}
