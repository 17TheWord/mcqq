# fabric-26.1 窗口的构建事实。
#
# 这些值以前都在根 gradle.properties。现在跟着窗口走，为的是**这个目录自包含** ——
# 打开它就知道这个窗口用的是哪个 MC、哪个 loader、哪个 Fabric API。
# 加一个新窗口 = 加一个这样的目录（见 docs/MULTIPLATFORM.md）。
#
# 机制：Gradle 会先读子项目自己的 gradle.properties，再沿目录向上找父级，
# 所以这里的键对这个窗口生效，而根文件里的共享值（mod_version、maven_group、库版本…）照常继承。
# ⚠️ 反过来不成立：这里的键对根项目和兄弟项目不可见 —— 需要共享的值必须留在根文件。

# Minecraft 26.1.2，Fabric 工具链（截至 2026-09-20）。
# 去混淆之后没有 mappings 行：源码用的就是 Mojang 名。
minecraft_version=26.1.2
loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2

# 发布时这个 jar **声称**覆盖哪些游戏版本（喂给 mc-publish 的 game-versions）。
# 每个窗口一份，不能共用 —— 26.x 的 jar 装不到 1.20.1 上。
# 值就是 JSON 数组，脚本原样传给 mc-publish。
publish_game_versions=[26.1, 26.2]
