# paper-1.20.1 窗口的构建事实。机制说明见 fabric/fabric-26.1/gradle.properties。

# Paper 的版本号有两种写法：1.20.1 那代是 `-R0.1-SNAPSHOT`，26.x 是 `26.1.2.build.N-stable`。
# 编译对**最老**的目标是插件端的标准做法：一个 jar 往上覆盖到 26.x。
paper_api_version=1.20.1-R0.1-SNAPSHOT

# ⚠️ Bukkit 一族是一个 jar 覆盖 1.20.1 → 26.x，所以这里写的是**范围**而不是列表 ——
# mc-publish 会去 Modrinth 拉已知游戏版本，把范围内的展开成具体 tag（v3.3+ 支持；
# 那个 `version-resolver` 参数已废弃，范围直接写在这里就行）。
# 上界 `<27` 与描述符 / `minecraft_version_range` 对齐：26.x → 27 破坏二进制兼容，不该声称。
publish_game_versions=>=1.20.1 <27
