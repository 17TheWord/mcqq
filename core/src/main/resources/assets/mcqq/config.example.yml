# MC ↔ QQ 桥接。改完敲 /qq reload，或者重启服务器。
#
# ⚠️ 这个文件里会有 AppSecret（下面的 `secret:`）。所以**别把 config.yml 贴到 issue / 群里** —— 要贴就贴这份
# config.example.yml（它没有密钥）。

# 打开后会把"为什么这条消息没有转发"的每一个判断都写进日志，转发成功时也会打印实际内容。
# 排障时开，平时关 —— 服务端日志会明显变多。
debug: false

# 命令执行：让 QQ 侧能执行 Minecraft 命令（比如 /mcc list）。
# 默认**关着** —— 这是唯一一条"从 QQ 能影响服务器"的路径，要显式打开。
# prefix 是命令头，三个面（群 / 子频道 / 私聊）都用它：群里发 "/mcc <命令>" 就是执行 <命令>。
command:
  enabled: false
  prefix: "/mcc"

# 每条消息长什么样。整段删掉就用内置默认，行为与老版本一致（/qq templates 能看到当前生效的值，
# 也会打印一段可以直接粘贴的写法）。空字符串表示"这个事件不播报"。
#
# 可用占位符：{group} {user} {text} {count} {member} {player} {killer} {platform} {time}
# 写错的占位符不会被替换掉，会原样显示出来 —— 一眼就能看出是拼错了。
templates:
  qq-chat: "§b[QQ {group}]§r {user}§7:§r {text}"
  qq-attachment: "§b[QQ {group}]§r {user} 发了 {count} 个附件（文字里不含它们）"
  qq-member-add: "§8[QQ {group}] {member} 进了群§r"
  qq-member-remove: "§8[QQ {group}] {member} 退了群§r"
  mc-chat: "[MC] {player}: {text}"
  mc-join: "[MC] {player} 加入了世界"
  mc-quit: "[MC] {player} 离开了世界"
  mc-death: "[MC] {player} 死亡（{killer}）"

bots:
  - id: main                       # 随便起个名字，它会出现在 /qq status 里
    app-id: "REPLACE_ME"           # QQ 开放平台的 AppID
    secret: "REPLACE_ME"           # QQ 开放平台的 AppSecret

    # 也可以把密钥放在环境变量里：删掉上面那行 secret，改用这一行写变量名。
    # 两个都填的话以文件里的 secret 为准，日志里会说一声。
    # secret-env: QQ_BOT_SECRET

    # 群有两种填法：
    #   ① 留空：把下面的 groups 整段删掉，或写成 []。开服后在群里 @ 一下机器人，再在控制台敲 /qq bind，
    #      插件会把最近说话的那个群写进这个文件并自动重载。
    #   ② 直接填：把群的 openid 写在下面。openid **不是** QQ 群号；走 ① 时它会打在日志和 /qq status 里。
    groups:
      - group-openid: "REPLACE_ME" # 群的 openid，不是 QQ 群号
        label: MC 主群
        receive-from-qq: true      # QQ → Minecraft
        send-to-qq:                # Minecraft → QQ；把这段删掉就用下面那四项默认值
          - chat
          - join
          - quit
          - death

        # 谁能在这个群里执行命令。三个来源**互相独立**，任一命中即可 —— 一个既不是群主、
        # 也不是管理员、但在白名单里的人照样能执行。整段不写 = 这个群里谁都执行不了。
        # command:
        #   allow: admin            # none 都不行 / owner 群主 / admin 群主与管理员
        #   whitelist: ["<用户 openid>"]   # QQ 侧的 openid，不看身份
        #   roles: []               # 额外允许的身份组 ID。群没有身份组，这个键是子频道用的
        #                           # （子频道管理员是 5；群主 4 / 管理员 2 归 allow 管，别写在这里）

        # 单个群可以覆盖上面 templates 里的任意几个键（只写要改的，其余继承全局）：
        # templates:
        #   mc-chat: "[主群] {player}: {text}"
        #   mc-join: ""              # 这个群不播报进服

# send-to-qq 可选：chat、join、quit、death。整个键删掉就取这四项。
