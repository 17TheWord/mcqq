org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Minecraft 26.1.2, on the Fabric toolchain as of 2026-09-20.
# The game is no longer obfuscated, so there is no mappings line to configure: sources use Mojang names.
# Loom and the shadow plugin carry their versions in build.gradle.kts, where a plugins block must name them.
minecraft_version=26.1.2
loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2

mod_version=0.0.1
maven_group=com.example.mcqq
archives_base_name=mc-qq

# The SDK is a plain jar; its OkHttp/Gson/kotlin and SnakeYAML are relocated into each platform jar by shadow.
qqbot_sdk_version=0.0.7
snakeyaml_version=2.5
# The doubled platform the tests run against; must be the OkHttp line the SDK ships on.
mockwebserver_version=4.12.0
# What Minecraft ships; core only compiles against it.
slf4j_version=2.0.17
# Brigadier is Mojang's own library (not a Minecraft class), which is why the core may build command nodes
# with it. 1.3.10 is what Minecraft 26.1.2 ships; it lives on Mojang's libraries repo, not Maven Central.
brigadier_version=1.3.10

# 描述符的公共字段（mod_id / mod_name / mod_authors / mod_license / mod_url / mod_description）
# **不在这里**，在 UTF-8 的 `descriptors.properties`。原因见那个文件顶部：gradle.properties 是
# Java Properties 格式（ISO-8859-1），非 ASCII 值会被双重编码，而 YAML 1.1 会因此拒绝 plugin.yml。
# 这个文件只放"构建旋钮"：版本号、坐标、范围。

# Forge. 26.1.2-64.1.3 = Minecraft 26.1.2, Forge build 64.1.3. Separate from NeoForge since 1.20.2.
forge_version=26.1.2-64.1.3
# What Forge's mods.toml demands of the loader: its own build number, not the game's.
forge_loader_version_range=[64,)

# Forge 1.20.1 —— 另一代。这一代官方给的是 ForgeGradle 6 + Gradle 8，但 ModDevGradle 的
# `net.neoforged.moddev.legacyforge` 支持 Forge 1.17–1.20.1，而它与上面 neoforge 用的
# `net.neoforged.moddev` 是**同一个 artifact 同一个版本** —— 所以这个窗口能待在同一个构建里，
# 不需要一套独立的 legacy 构建。依据见 docs/MULTIPLATFORM.md 第六节。
# 1.20.1-47.4.23 = Minecraft 1.20.1, Forge build 47.4.23.
forge_1201_version=1.20.1-47.4.23
# 1.20.1 的 FML 是 47.x；mods.toml 只要主版本号。
forge_1201_loader_version_range=[47,)
# 1.20.1 自己的窗口：它跑不了 1.20.2 及以后的任何东西。
forge_1201_minecraft_version_range=[1.20.1, 1.21)

# NeoForge. Its version is four parts: 26.1.2.109 = build 109 for Minecraft 26.1.2.
neoforge_version=26.1.2.109
# What the descriptor demands of the loader itself (FML). NeoForge 26.1.2 ships 3.x, and its own descriptor
# says "[3,)" — so that is what a mod may ask for.
neoforge_loader_version_range=[3,)
# What the published versions claim on Modrinth / CurseForge — the window we actually ran on a server.
# **每个窗口一份，不能共用**：26.x 的 jar 装不到 1.20.1 上，写成一份列表会让发布页误导人。
# 名字里的点写成下划线（`26_1` = 窗口 `26.1`），与目录名一一对应。platforms.yml 读出来挂到矩阵每一行上。
publish_game_versions_26_1=[26.1, 26.2]
publish_game_versions_1_20_1=[1.20.1, 1.20.2]

# The window one jar covers, spelled the way each descriptor wants it. Same claim as the Fabric side's
# `>=26.1`: the build targets 26.1.2, the range is what the file advertises.
minecraft_version_range=[26.1,)

# ⚠️ **Bukkit 一族编译对的是最老的目标，不是最新的。** 这是插件端的标准做法：编译对 1.20.1，一个 jar
# 往上覆盖到 26.x —— 因为 Bukkit 只在"插件声明的 api-version 比服务端新"时拒绝加载，反过来一路放行。
# 编译对最新的（26.1.2）会得到相反的效果：只用 26.x 才有的符号，装到 1.20.1 上 NoSuchMethodError。
# 代价是只能用 1.20.1 就有的 API —— 对本项目无所谓，用到的全是十来年没动过的东西
# （AsyncPlayerChatEvent / AsyncChatEvent / PlayerJoinEvent / getScheduler / Adventure Component）。
# 验证：三个模块分别编译对 1.20.1 的 API 都过，且在 Paper 1.20.1 与 26.2 上都跑过。
#
# Paper 的版本号有两种写法：1.20.1 那代是 `-R0.1-SNAPSHOT`，26.x 是 `26.1.2.build.N-stable`。
paper_api_version=1.20.1-R0.1-SNAPSHOT
# Spigot 一直只发 snapshots。bukkit-common 编译对这一个（Bukkit 一族的最低公分母），Paper 的 API 是它的超集。
spigot_api_version=1.20.1-R0.1-SNAPSHOT

# `core` is compiled to this release on purpose: 17 is what Minecraft 1.18–1.20.4 runs on, so one core jar
# serves every window from 1.20.1 up to 26.x (Minecraft moved to Java 21 at 1.20.5 and to Java 25 at 26.1, and a
# Java 17 class file loads on all of them). The bridge's dispatch used virtual threads — a Java 21 API — so it
# now uses a cached thread pool instead; that was the only Java 21 feature in the module.
core_java_release=17
